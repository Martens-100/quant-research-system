# ============================================================================
# 固定指标配置 · 待确认版
# ============================================================================
# 生成日期: 2026-10-08
# 用途: 股票池筛选与风控的固定参数集。填写完成后即成为系统的配置基线。
#
# 三类字段的处理规则:
#   [YOU]  必须由你提供 —— 个人约束，我无法代定
#   [ME]   已由我定义   —— 市场客观事实，有公认口径，你只需确认无异议
#   [BOTH] 我给建议你确认 —— 需校准的阈值，受持有期限影响
#
# 填写方式: 把 null 替换为你的值。带 <<>> 的是提示，填完请删除。
# 未填项不得进入系统 —— 缺参数的规则会静默失效，比没有规则更危险。
# ============================================================================

meta:
  schema: "workbuddy.fixed-indicators/v1"
  generated: "2026-10-08"
  status: "DRAFT"          # DRAFT -> 填写完成改为 CONFIRMED
  confirmed_by: null       # [YOU] 填写你的确认日期
  review_cycle: "quarterly"  # 建议每季度复核一次


# ============================================================================
# 第 1 类 · 必须由你提供 [YOU]
# ============================================================================
# 这 8 项是系统的输入，不是系统的产物。
# 任何我填的默认值都不具备约束力 —— 因为它们是"你能承受什么"，不是"市场是什么"。
# ============================================================================

personal_constraints:

  total_capital:
    value: null
    unit: "CNY"
    # <<你的总资金规模（元）。是否包含未来追加资金？>>
    why: "决定最小可交易单位与合理持仓数；小资金无法有效分散"

  max_loss_per_trade:
    value: null
    unit: "pct"
    suggested_range: [0.5, 2.0]
    # <<单笔最大可承受损失，占总资金的百分比>>
    why: "整个风控体系的锚点。仓位由它反推，不能由我替你决定你能承受多少亏损"

  max_drawdown_circuit_breaker:
    value: null
    unit: "pct"
    # <<总回撤熔断线。触及则停止开新仓。>>
    why: "纪律条款而非计算题，取决于心理承受力与资金性质"

  max_position_per_symbol:
    value: null
    unit: "pct"
    note: "你此前设定 8%–12%，请确认是否仍适用"
    why: "决定能否承受单只黑天鹅"

  max_concurrent_positions:
    value: null
    unit: "count"
    suggested_range: [5, 15]
    why: "决定分散度与精力上限"

  holding_horizon:
    value: null
    enum: ["short", "medium", "long"]
    # short  = 短线 <20 个交易日
    # medium = 中线 20–120 个交易日
    # long   = 长线 >120 个交易日
    why: "期限不同，适用的指标与参数完全不同 —— 这是所有参数选择的前提"

  trading_permissions:
    margin: null          # <<是否可融资？true/false>>
    short_selling: null   # <<是否可做空？true/false>>
    star_market: null     # <<是否可交易科创板/创业板（±20% 涨跌幅）？true/false>>
    st_stocks: null       # <<是否交易 ST 股（±5% 涨跌幅）？true/false>>
    why: "决定风控阈值与可选标的范围"

  actual_trading_cost:
    # 印花税已核验，无需你提供，见下方 [ME] 组
    commission_rate: null
    unit: "pct"
    # <<佣金费率，双向。注意你的券商是否有单笔最低收费（常见 5 元）>>
    commission_min: null
    unit: "CNY"
    # <<单笔最低佣金。小资金交易时它可能主导成本>>
    transfer_fee_rate: null
    unit: "pct"
    # <<过户费费率，双向>>
    slippage_assumption: null
    unit: "pct"
    suggested_range: [0.05, 0.2]
    # <<滑点假设。建议保守取值，回测时按悲观口径。>>
    why: "券商费率因人而异，必须以你的对账单为准。缺此项会导致参数寻优系统性偏向高频参数"


# ============================================================================
# 第 2 类 · 已由我定义 [ME]
# ============================================================================
# 有公认口径，不因个人而变。你只需确认无异议。
# ============================================================================

market_facts:

  # ---- 基本面 ----
  revenue_growth:
    formula: "(本期营收 - 上年同期营收) / 上年同期营收"
    granularity: ["单季", "累计"]
    source: "定期报告（合并口径）"
    note: "单季与累计背离时须解释原因"

  deducted_net_profit_growth:
    formula: "同上，使用扣除非经常性损益后归母净利润"
    source: "定期报告"
    why: "防非经常性损益掩盖主营恶化。实证：科伦药业 2026H1 归母 +12.71% 而扣非 -29.03%，背离 41.7pct"

  divergence_ratio:
    formula: "abs(归母净利增速 - 扣非净利增速)"
    unit: "pct"
    why: "量化利润质量，比单看任一增速更能发现问题"

  ocf_to_net_profit:
    formula: "报告期经营活动现金流净额 / 归母净利润"
    why: "利润含金量。<0.8 说明利润未有效转化为现金"

  gross_margin_trend:
    formula: "连续 3 期毛利率的变化方向"
    note: "单期值无意义，趋势才有意义"

  roe_weighted:
    formula: "加权平均净资产收益率"
    note: "注意与摊薄口径区分，跨公司比较时须统一"

  debt_to_asset:
    formula: "总负债 / 总资产"
    scope: "合并口径"

  goodwill_to_equity:
    formula: "商誉 / 归母股东权益"

  # ---- 估值 ----
  pe_ttm_percentile:
    formula: "当前 PE(TTM) 在近 10 年分布中的百分位"
    lookback: "10y"
    why: "比绝对 PE 更能说明市场已定价到什么程度。实证：科伦药业 2026-10-08 PE(TTM) 34.15–35.53 倍，历史分位 94.2%"
    caveat: "两数据源存在约 4% 分歧，使用时须并列标注"

  # ---- 技术面 ----
  volatility_percentile:
    formula: "60 日收益率标准差年化，取其在近 250 个交易日的分位"
    why: "A 股波动率替代方案。回答『这只股票比它自己平时更波动吗』，不依赖是否存在波动率指数"
    note: "原方案理由为『中国波指已停止发布』，该断言证据不足已撤回；方法本身仍成立"

  atr20:
    formula: "20 日平均真实波幅"
    why: "止损宽度的基准，替代固定整数止损"

  ma_periods:
    value: [5, 10, 20, 60, 250]
    adjustment: "前复权"
    why: "短中长三级趋势判断的标准周期"

  # ---- 交易成本（已核验部分）----
  stamp_duty:
    value: 0.05
    unit: "pct"
    direction: "卖出单边"
    verified: true
    verification: "经 2025-11 与 2026-09 两批独立公开资料交叉确认"
    note: "此项无需你提供"

  # ---- 制度约束 ----
  settlement:
    cn: "T+1"   # 当日买入不可当日卖出
    us: "T+0"
    why: "回测引擎必须建模，否则高估收益"

  price_limit:
    cn_main: "±10%"
    cn_star_gem: "±20%"
    cn_st: "±5%"
    us: "无涨跌停（有 LULD 熔断）"
    why: "连续跌停时止损无法成交，风险预算公式失效，须重算最坏损失"

  suspension_rule:
    cn: "重大资产重组等可停牌数月"
    why: "停牌期间持仓锁定、监控计时暂停；复牌首日不适用常规止损"


# ============================================================================
# 第 3 类 · 我给建议值，你确认 [BOTH]
# ============================================================================
# 判据阈值：有理论依据但无唯一正确答案，且受持有期限影响。
# confirmed 字段留 null，你确认后填 true；如需修改，直接改 value。
# ============================================================================

thresholds:

  - key: "revenue_growth_min"
    value: 20
    unit: "pct"
    adjustable_range: [15, 30]
    confirmed: null
    why: "沿用你原有设定。上限不宜过高，否则池子过小"

  - key: "deducted_np_growth_min"
    value: 0
    unit: "pct"
    adjustable_range: null
    confirmed: null
    why: "建议设为固定约束而非可调参数 —— 它是否决项，不该被优化掉"

  - key: "divergence_alert"
    value: 15
    unit: "pct"
    adjustable_range: [10, 25]
    confirmed: null
    why: "科伦药业实测 41.7pct 属极端；15pct 作为预警线较保守"

  - key: "gross_margin_trend_window"
    value: 3
    unit: "期"
    adjustable_range: [2, 4]
    confirmed: null
    why: "3 期足以过滤单季波动，又不会反应过慢"

  - key: "roe_min"
    value: 15
    unit: "pct"
    adjustable_range: [12, 20]
    confirmed: null
    why: "低于 12% 难以覆盖资金成本；高于 20% 会排除多数行业"

  - key: "debt_to_asset_max"
    value: 60
    unit: "pct"
    adjustable_range: [50, 70]
    confirmed: null
    why: "行业差异大，金融/地产需按行业豁免"

  - key: "goodwill_to_equity_max"
    value: 10
    unit: "pct"
    adjustable_range: [5, 15]
    confirmed: null
    why: "超 10% 减值风险显著上升"

  - key: "stop_loss_atr_multiple"
    value: 2.0
    unit: "x ATR20"
    adjustable_range: [1.5, 3.0]
    confirmed: null
    why: "2 倍为常见起点。倍数越小越易被噪声打掉，越大单笔损失越大"

  - key: "signal_decay_window"
    value: 3
    unit: "交易日"
    adjustable_range: [2, 5]
    confirmed: null
    why: "防止用旧信号做新决策。具体值须回测"

  - key: "crowding_threshold"
    value: null
    unit: "融资余额历史分位"
    adjustable_range: null
    confirmed: null
    status: "PENDING_CALIBRATION"
    why: "修正项：原值 >80% 分位来自单一案例（科伦药业），属方法论错误，已撤回"
    calibration_method: |
      对历史全样本按融资余额分位分 5 档，
      检验各档后续 20 个交易日的收益与最大回撤是否单调分化。
      校准完成前，该项不得写入任何规则。

  - key: "optimization_objective"
    value: "Sortino"
    constraint: "CVaR(5%)"
    confirmed: null
    why: "修正项：原用卡玛比率，但最大回撤是路径依赖的极值统计量，对样本期高度敏感、易过拟合。Sortino 只惩罚下行波动，更稳健"
    note: "卡玛比率保留为展示指标，不作为优化目标"


# ============================================================================
# 修正项汇总（相对上一轮方案的变更）
# ============================================================================

