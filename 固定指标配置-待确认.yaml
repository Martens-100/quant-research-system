  - id: 17
    type: "论证弱"
    issue: "缺跨步骤优先级"
    action: "补 P0–P4 执行顺序"


# ============================================================================
# 执行顺序（P0 必须先完成，否则后续为空转）
# ============================================================================

execution_order:
  P0:
    blocking: true
    items:
      - "[YOU] 确认 2026-08-24 与 2026-09-29 两次动作是否执行"
      - "[YOU] 填写第 1 类全部 8 项个人约束"
    why: "纯输入，不需加工；缺了它们后续全是空转"
  P1:
    items:
      - "补『选股筛选研报』最简版（门槛 + 否决原因）"
      - "建立排除日志（用相对基准）"
    why: "筛选是唯一带否决权的环节，其错误会被复制到池内每一只标的"
  P2:
    items:
      - "校准拥挤度阈值（分档回测）"
      - "定义交易成本与 T+1 建模"
      - "补涨跌停/停牌的损失重算规则"
    why: "在它们完成前跑出的任何参数结论都不可信"
  P3:
    items:
      - "11 指标压缩为三级信号 + 三态定义"
      - "第四步改为风险预算法"
      - "第五步监控清单补阈值与动作"
    why: "规则改造，依赖 P0 的个人约束与 P2 的制度建模"
  P4:
    items:
      - "用 NVDA 跑一遍完整五步，验证美股侧"
      - "参数寻优（Sortino 目标）"
    why: "规则未定、成本未建模时做寻优，等于在流沙上盖楼"
